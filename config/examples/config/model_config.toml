[inner]
version = "1.17.9"

[[models]]
model_identifier = "agnes-3.0-flash"
name = "agnes-3.0-flash"
api_provider = "AgnesAI"
price_in = 0
price_out = 0
cache = false
cache_price_in = 0
send_temperature = true
visual = true
force_stream_mode = false

[models.extra_params]

[[models]]
model_identifier = "deepseek-flash"
name = "deepseek-official-flash"
api_provider = "DeepSeek"
price_in = 0
price_out = 0
cache = true
cache_price_in = 0
send_temperature = true
visual = true
force_stream_mode = false

[models.extra_params]
[model_task_config.replyer]
model_list = ["deepseek-official-flash"]
max_tokens = 2048
temperature = 0.8
slow_threshold = 12
selection_strategy = "sequential"
hard_timeout = 90

[model_task_config.planner]
model_list = ["deepseek-official-flash"]
max_tokens = 4096
temperature = 0.5
slow_threshold = 12
selection_strategy = "sequential"
hard_timeout = 90

[model_task_config.memory]
