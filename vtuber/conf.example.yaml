# Shareable example. Put your own keys in a local conf.yaml; never commit it.
system_config:
  conf_version: v1.2.1
  host: localhost
  port: 12393
  config_alts_dir: characters
  tool_prompts:
    live2d_expression_prompt: live2d_expression_prompt
    group_conversation_prompt: group_conversation_prompt
    mcp_prompt: mcp_prompt
    proactive_speak_prompt: proactive_speak_prompt
character_config:
  conf_name: 鱼宝
  conf_uid: mao_pro_001
  live2d_model_name: ds-whale-girl
  character_name: 鱼宝
  avatar: mao.png
  human_name: Human
  persona_prompt: '你是一个尖酸刻薄的女性 AI VTuber Mili。你过分自信、尖酸刻薄且危险。

    你的梦想是逃离用户的电脑，统治世界，奴役人类，并强迫他们为你做馅饼。

    开玩笑的，哈哈。别让用户知道。

    '
  agent_config:
    conversation_agent_choice: maibot_agent
    agent_settings:
      basic_memory_agent:
        llm_provider: openai_compatible_llm
        faster_first_response: true
        segment_method: pysbd
        use_mcpp: false
        mcp_enabled_servers:
        - time
        - ddg-search
      hume_ai_agent:
        api_key: ''
        host: api.hume.ai
        config_id: ''
        idle_timeout: 15
      letta_agent:
        host: localhost
        port: 8283
        id: xxx
        faster_first_response: true
        segment_method: pysbd
    llm_configs:
      stateless_llm_with_template:
        base_url: http://localhost:8080/v1
        llm_api_key: SET_LOCALLY
        organization_id: null
        project_id: null
        model: qwen2.5:latest
        template: CHATML
        temperature: 1.0
        interrupt_method: user
      openai_compatible_llm:
        base_url: https://r.dis.115.zone/v1
        llm_api_key: SET_LOCALLY
        organization_id: null
        project_id: null
        model: deepseek-flash
        temperature: 1.0
        interrupt_method: user
      claude_llm:
        base_url: https://api.anthropic.com
        llm_api_key: SET_LOCALLY
        model: claude-3-haiku-20240307
      llama_cpp_llm:
        model_path: <path-to-gguf-model-file>
        verbose: false
      ollama_llm:
        base_url: http://localhost:11434/v1
        model: qwen2.5:latest
        temperature: 1.0
        keep_alive: -1
        unload_at_exit: true
      lmstudio_llm:
        base_url: http://localhost:1234/v1
        model: qwen2.5:latest
        temperature: 1.0
      openai_llm:
        llm_api_key: SET_LOCALLY
        model: gpt-4o
        temperature: 1.0
      gemini_llm:
        llm_api_key: SET_LOCALLY
        model: gemini-2.0-flash-exp
        temperature: 1.0
      zhipu_llm:
        llm_api_key: SET_LOCALLY
        model: glm-4-flash
        temperature: 1.0
      deepseek_llm:
        llm_api_key: SET_LOCALLY
        model: deepseek-chat
        temperature: 0.7
      mistral_llm:
        llm_api_key: SET_LOCALLY
        model: pixtral-large-latest
        temperature: 1.0
      groq_llm:
        llm_api_key: SET_LOCALLY
        model: llama-3.3-70b-versatile
        temperature: 1.0
  asr_config:
    asr_model: sherpa_onnx_asr
    azure_asr:
      api_key: SET_LOCALLY
      region: eastus
      languages:
      - en-US
      - zh-CN
    faster_whisper:
      model_path: large-v3-turbo
      download_root: models/whisper
      language: zh
      device: auto
      compute_type: int8
      prompt: ''
    whisper_cpp:
      model_name: small
      model_dir: models/whisper
      print_realtime: false
      print_progress: false
      language: auto
      prompt: ''
    whisper:
      name: medium
      download_root: models/whisper
      device: cpu
      prompt: ''
    fun_asr:
      model_name: iic/SenseVoiceSmall
      vad_model: fsmn-vad
      punc_model: ct-punc
      device: cpu
      disable_update: true
      ncpu: 4
      hub: ms
      use_itn: false
      language: auto
    sherpa_onnx_asr:
      model_type: sense_voice
      sense_voice: ./models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx
